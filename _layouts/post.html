---
layout: default
---

<article class="post-content">
    <header class="post-header">
        <div class="post-meta">
            {{ page.date | date: "%B %-d, %Y" }} • by {{ page.author | default: site.author }}
        </div>
        <h1>{{ page.title }}</h1>
    </header>

    {{ content }}
</article>
