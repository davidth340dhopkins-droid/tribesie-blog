---
layout: default
---

<ul class="post-list">
  {% for post in site.posts %}
    <li class="post-item">
      <div class="post-meta">{{ post.date | date: "%B %-d, %Y" }}</div>
      <a class="post-link" href="{{ post.url | relative_url }}">
        {{ post.title | escape }}
      </a>
    </li>
  {% endfor %}
</ul>
